<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>АрендаID Türkiye</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Golos+Text:wght@400;500;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky registry bar, single centered column (max 1080px); contracts render as a paper sheet in the document serif; ID codes look like rubber-stamp ink. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#14221F; --muted:#5A6B66; --line:#D2DCD9;
  --accent:#1D5C4C; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --stamp:#4A3C9C; --stamp-soft:#ECE9F8;
  --good:#1E7A4F; --good-soft:#DAF0E3; --warn:#8F5600; --warn-soft:#FBEBD0; --bad:#A3302A; --bad-soft:#F8DEDB;
  --paper:#FFFFFF; --paper-ink:#1C1C1A; --ph:#8A5A00; --ph-bg:#FFF3D6;
  --f-head:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-doc:'PT Serif',Georgia,'Times New Roman',serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#15201D; --surface-2:#1A2724; --ink:#E3EBE8; --muted:#9AABA6; --line:#2A3A36;
  --accent:#62BA9E; --accent-ink:#0A1210; --accent-soft:#1C3530;
  --stamp:#AFA2F2; --stamp-soft:#262150;
  --good:#71D4A2; --good-soft:#173326; --warn:#E9B565; --warn-soft:#3A2C12; --bad:#F08C82; --bad-soft:#3D1C1A;
  --paper:#18221F; --paper-ink:#E5ECE9; --ph:#F0C26E; --ph-bg:#3A2D10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#15201D; --surface-2:#1A2724; --ink:#E3EBE8; --muted:#9AABA6; --line:#2A3A36;
  --accent:#62BA9E; --accent-ink:#0A1210; --accent-soft:#1C3530;
  --stamp:#AFA2F2; --stamp-soft:#262150;
  --good:#71D4A2; --good-soft:#173326; --warn:#E9B565; --warn-soft:#3A2C12; --bad:#F08C82; --bad-soft:#3D1C1A;
  --paper:#18221F; --paper-ink:#E5ECE9; --ph:#F0C26E; --ph-bg:#3A2D10; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(26px,4.4vw,40px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-head);font-weight:800;font-size:18px}
.mark{width:30px;height:30px;border:2px solid var(--stamp);border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--stamp);transform:rotate(-6deg)}
nav{display:flex;flex-wrap:wrap;gap:2px;flex:1}
nav a{padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px}
nav a:hover{color:var(--ink);background:var(--surface-2)}
nav a.on{color:var(--accent);background:var(--accent-soft)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

main{padding-block:28px 64px}
.stack{display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.soft{background:var(--surface-2)}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1 var(--f-body);padding:10px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* forms */
form{display:flex;flex-direction:column;gap:16px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px 14px;min-width:0}
legend{font-family:var(--f-head);font-weight:700;padding:0 6px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.wide{grid-column:1/-1}
input,select{font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
input.mono{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.check{flex-direction:row;align-items:flex-start;gap:8px;color:var(--ink)}
.check input{width:auto;margin-top:3px}
.hint{font-size:12px;color:var(--muted)}
.hint.ok{color:var(--good)} .hint.no{color:var(--bad)} .hint.warn{color:var(--warn)}

/* stamp-style code chips */
.code{font-family:var(--f-mono);font-weight:600;color:var(--stamp);background:var(--stamp-soft);border:1.5px dashed var(--stamp);border-radius:6px;padding:2px 7px;white-space:nowrap;letter-spacing:.03em;font-size:.92em}
.code.big{font-size:clamp(20px,5vw,30px);padding:8px 16px;display:inline-block;transform:rotate(-1.5deg)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.stamp{background:var(--stamp-soft);color:var(--stamp);border-color:transparent}

/* hero & steps */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero p.lead{font-size:17px;color:var(--muted);max-width:60ch;margin-top:12px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.steps li::before{content:attr(data-step) " " counter(s);font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.mini-doc{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:6px;padding:18px;font-family:var(--f-doc);font-size:13.5px;line-height:1.6;box-shadow:0 10px 30px -18px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px;transform:rotate(.6deg)}
.mini-doc .ttl{text-align:center;font-weight:700;letter-spacing:.04em}
.strike{text-decoration:line-through;color:var(--muted)}

/* templates */
.tpl-card h3{font-size:18px}
.tpl-card .ic{width:40px;height:40px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tpl-card ul{font-size:13.5px}
.tpl-card .row{margin-top:auto}

/* paper contract */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;padding:clamp(20px,5vw,56px);font-family:var(--f-doc);font-size:15.5px;line-height:1.7;max-width:820px;margin:0 auto;width:100%;min-width:0}
.paper h2.doc-t{font-family:var(--f-doc);text-align:center;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.paper .doc-sub{text-align:center;margin-top:4px}
.paper .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 14px;font-style:italic}
.paper h4{font-family:var(--f-doc);font-size:15.5px;margin:22px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.paper p{margin:0 0 6px;text-align:justify;hyphens:auto}
.paper .ph{background:var(--ph-bg);color:var(--ph);font-family:var(--f-body);font-size:.82em;padding:1px 5px;border-radius:4px;white-space:nowrap}
.paper .fill{font-weight:700}
.essentials{border:1.5px solid var(--paper-ink);padding:12px 16px;margin:12px 0 4px;font-size:14px}
.essentials table{width:100%;border-collapse:collapse}
.essentials td{padding:3px 0;vertical-align:top}
.essentials td:first-child{width:42%;padding-right:12px;font-style:italic}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:24px;margin-top:28px}
.sig > div{border-top:1px solid var(--paper-ink);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.qrrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qr{width:96px;height:96px;padding:4px;background:#FFFFFF;border:1px solid var(--line);border-radius:4px;cursor:pointer;flex:none}
.qr img,.qr canvas{width:100%!important;height:100%!important;display:block}
.qr.fallback{display:grid;place-items:center;font:11px var(--f-body);color:#333;text-align:center}
.sigline{border-bottom:1px solid var(--paper-ink);height:28px;max-width:220px}

/* requests & data */
.req{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.req.attn{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.req.live{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.reveal{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;border:1.5px solid var(--good);border-radius:var(--r);padding:18px;background:var(--surface)}
.wm{position:absolute;inset:-40%;display:flex;flex-wrap:wrap;gap:40px 60px;transform:rotate(-24deg);opacity:.09;pointer-events:none;font:600 13px var(--f-mono);color:var(--ink);align-content:center}
.timer{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--good)}
.bar{height:5px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);transition:width 1s linear}
.wait{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.wait{animation:none}.bar i{transition:none}}

.msg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.msg:first-child{border-top:0}
.tbl-wrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.notice{border-radius:var(--r);padding:12px 14px;font-size:14px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.notice b{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
footer{border-top:1px solid var(--line);padding-block:20px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex-direction:row;align-items:center;gap:6px;padding:8px 12px;cursor:pointer;color:var(--ink);font-size:14px}
.seg input{width:auto}
.tplpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.tplpick label{flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);cursor:pointer;font-size:14px}
.tplpick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tplpick input{width:auto}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{appearance:none;border:0;background:var(--surface);color:var(--muted);font:600 13px/1 var(--f-body);padding:8px 10px;cursor:pointer}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:760px){.top nav{order:3;flex-basis:100%;gap:2px 0}.top .wrap{justify-content:space-between}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#home"><span class="mark">ID</span><span id="brandName">АрендаID</span> <span class="pill stamp">TR</span></a>
  <nav id="nav"></nav>
  <div class="who" id="who"></div>
</div></header>

<main><div class="wrap" id="app"></div></main>

<footer><div class="wrap">
  <span id="footTxt"></span>
  <button class="btn sm" id="resetBtn" type="button"></button>
</div></footer>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ---------- storage ---------- */
const KEY='arendaid-tr-v1', VIEW_MS=180000, PENDING_MS=15*60000;
const mem={};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}};
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return mem['s:'+k]??null}};
const ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){mem['s:'+k]=v}};
function load(){try{const r=lsGet(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){lsSet(KEY,JSON.stringify(S))}
const emptyState=()=>({v:3,users:{},contracts:{},id2:{},requests:{},outbox:[],used:{},seq:100,demoContract:null});

let S=load();
let me=ssGet('arendaid-me');
let myReqs=[];try{myReqs=JSON.parse(ssGet('arendaid-reqs')||'[]')}catch(e){myReqs=[]}
const saveMyReqs=()=>ssSet('arendaid-reqs',JSON.stringify(myReqs));
const setMe=id=>{me=id;ssSet('arendaid-me',id||'');renderWho()};

/* ---------- язык интерфейса ---------- */
let uiLang=lsGet('arendaid-tr-ui')==='tr'?'tr':'ru';
const tx=(ru,tr)=>uiLang==='tr'?tr:ru;
const pick2=p=>Array.isArray(p)?(uiLang==='tr'?p[1]:p[0]):String(p??'');

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function rnd(n){const a=new Uint32Array(n);crypto.getRandomValues(a);let s='';for(const x of a)s+=ALPH[x%32];return s}
function uniq(gen){let x;do{x=gen()}while(S.used[x]);S.used[x]=1;return x}
const iso=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const fmtDate=s=>{if(!s)return'';const[y,m,d]=String(s).split('-');return `${d}.${m}.${y}`};
const fmtDT=ts=>new Date(ts).toLocaleString(uiLang==='tr'?'tr-TR':'ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const maskEmail=e=>{const[a,b]=String(e||'').split('@');return (a?a[0]:'')+'•••@'+(b||'')};
const maskPhone=p=>'+•• ••• ••• •• '+String(p||'').replace(/\D/g,'').slice(-2);
const fio=u=>[u.first,u.middle,u.last].filter(Boolean).join(' ');
const normId=s=>String(s||'').trim().toUpperCase().replace(/\s+/g,'');
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast(tx('Скопировано','Kopyalandı'))}catch(e){toast(tx('Не удалось скопировать. Выделите текст вручную.','Kopyalanamadı. Metni elle seçin.'))}}
const baseUrl=()=>location.href.split('#')[0];

/* ---------- domain ---------- */
function addUser(d){const id=uniq(()=>'ID-'+rnd(4)+'-'+rnd(4));const u={...d,id,createdAt:Date.now()};S.users[id]=u;return u}
function createContract(type,terms,ids,createdBy,allConfirmed){
  const cid=uniq(()=>'C'+rnd(8));const no=new Date().getFullYear()+'/'+String(++S.seq).padStart(5,'0');
  const parties={};
  for(const role of ['landlord','tenant']){
    const id2=uniq(()=>'D2-'+rnd(5)+'-'+rnd(5));const ok=allConfirmed||ids[role]===createdBy;
    parties[role]={userId:ids[role],id2,confirmed:ok,confirmedAt:ok?Date.now():null};
    S.id2[id2]={userId:ids[role],contractId:cid,role};
  }
  S.contracts[cid]={id:cid,no,type,terms,parties,createdBy,createdAt:Date.now()};
  const other=ids.landlord===createdBy?ids.tenant:ids.landlord;
  if(!allConfirmed&&other!==createdBy)notify(other,['cabinet','email'],[`Вас указали стороной договора № ${no}. Подтвердите участие в личном кабинете.`,`${no} numaralı sözleşmede taraf olarak gösterildiniz. Katılımınızı hesabınızdan onaylayın.`]);
  return S.contracts[cid];
}
function notify(userId,channels,text){const u=S.users[userId];if(!u)return;for(const ch of channels){S.outbox.unshift({to:userId,ch,addr:ch==='email'?maskEmail(u.email):ch==='sms'?maskPhone(u.phone):'',text,at:Date.now()})}S.outbox=S.outbox.slice(0,200)}
const PURPOSES=[['Проверка стороны перед подписанием','İmza öncesi taraf kontrolü'],['Исполнение договора (оплата, акт, переписка)','Sözleşmenin ifası (ödeme, tutanak, yazışma)'],['Отметка об аренде в tapu (şerh)','Tapuya kira şerhi'],['Нотариальное действие (noter)','Noter işlemi'],['Запрос суда или государственного органа','Mahkeme veya kamu kurumu talebi'],['Другое','Diğer']];

function createRequest(id2,requesterId,label,purpose){
  const link=S.id2[id2];if(!link)return null;
  const c=S.contracts[link.contractId];
  const r={id:uniq(()=>'R'+rnd(8)),id2,ownerId:link.userId,contractId:link.contractId,role:link.role,requesterId,requesterLabel:label,purpose,status:'pending',createdAt:Date.now()};
  S.requests[r.id]=r;
  const who=requesterId?`${label} (${requesterId})`:label;
  notify(link.userId,['email','sms','cabinet'],[`Запрос на просмотр ваших данных по ID2 ${id2} (договор № ${c.no}). Кто: ${who}. Цель: ${PURPOSES[purpose][0]}. Разрешить или отклонить можно в личном кабинете.`,`ID2 ${id2} kodunuz (${c.no} numaralı sözleşme) için bilgi görüntüleme talebi. Talep eden: ${who}. Amaç: ${PURPOSES[purpose][1]}. Hesabınızdan onaylayabilir veya reddedebilirsiniz.`]);
  myReqs.unshift(r.id);saveMyReqs();save();return r;
}
function decide(rid,ok){const r=S.requests[rid];if(!r||r.status!=='pending')return;
  r.status=ok?'approved':'denied';r.decidedAt=Date.now();if(ok)r.expiresAt=Date.now()+VIEW_MS;
  if(r.requesterId)notify(r.requesterId,['cabinet'],ok?[`Владелец ID2 ${r.id2} разрешил просмотр данных на 3 минуты.`,`ID2 ${r.id2} sahibi bilgilerin 3 dakika görüntülenmesine izin verdi.`]:[`Владелец ID2 ${r.id2} отклонил ваш запрос.`,`ID2 ${r.id2} sahibi talebinizi reddetti.`]);
  save();}
function revoke(rid){const r=S.requests[rid];if(r&&r.status==='approved'){r.status='revoked';r.decidedAt=Date.now();save()}}
function sweep(){let ch=false;const n=Date.now();for(const r of Object.values(S.requests)){if(r.status==='approved'&&n>=r.expiresAt){r.status='expired';ch=true}else if(r.status==='pending'&&n-r.createdAt>PENDING_MS){r.status='timeout';ch=true}}if(ch)save();return ch}

/* срок, депозит и предупреждения */
function termInfo(t){
  if(!t||!t.startDate||!t.endDate)return{days:null,months:null,bad:false};
  const s=new Date(t.startDate+'T00:00'),e=new Date(t.endDate+'T00:00');const days=Math.round((e-s)/864e5)+1;
  return{days,months:Math.max(0,Math.round(days/30.44)),bad:e<=s};
}
function trNotes(type,t,forForm){
  const out=[];const ti=termInfo(t);const realty=TPL[type].realty;
  if(forForm&&ti.bad)out.push(['no','Дата окончания должна быть позже даты начала.']);
  if(realty&&t.rent&&t.deposit&&+t.deposit>3*+t.rent)out.push(['no','Депозит не может превышать арендную плату за 3 месяца (ст. 342 TBK).']);
  if(type==='residential'&&ti.days!==null&&!ti.bad&&ti.days<=100)out.push(['warn','Сдача жилья на срок до 100 дней в туристических целях требует разрешения Министерства культуры и туризма (закон № 7464). Без разрешения грозят крупные штрафы.']);
  if(realty&&ti.days!==null&&!ti.bad&&ti.days<=183)out.push(['warn','Если помещение сдаётся для временного использования на срок до 6 месяцев, особые правила TBK о жилых и коммерческих помещениях (ст. 339–356) не применяются (ст. 339/2).']);
  if(type==='commercial')out.push(['info','Договор аренды коммерческого помещения облагается гербовым сбором (damga vergisi) — 0,189% от суммы арендной платы за весь срок.']);
  if(type==='vehicle')out.push(['info','С 1 января 2027 года компании, сдающие автомобили в аренду потребителям, обязаны иметь разрешение (yetki belgesi), а автомобили старше 6 лет или с пробегом более 180 000 км сдавать нельзя. По опубликованным данным, на частных лиц, сдающих свой автомобиль, это требование не распространяется.']);
  return out;
}

function valueFn(terms,lang){
  return k=>{const val=terms?terms[k]:undefined;const f=F[k]||{};
    if(val===undefined||val===null||val==='')return `<span class="ph">[${esc(lang==='tr'?(f.phTr||f.lt||f.l):(f.ph||f.l))}]</span>`;
    let out=val; if(f.o)out=(f.o[+val]||f.o[0])[lang]; else if(f.t==='date')out=fmtDate(val); else if(['rent','deposit'].includes(k))out=Number(val).toLocaleString('tr-TR');
    return `<span class="fill">${esc(out)}</span>`;};
}
function id2Chip(c,role,lang){return c&&c.parties?`<span class="code">${esc(c.parties[role].id2)}</span>`:`<span class="ph">[${lang==='tr'?ROLE_TR[role]+' ID2':'ID2 '+roleN(c.type,role,1)}]</span>`}

   [H('Teslim ve İade','Передача и возврат'),[T.hand(v),...handBack]],

   [H('Uyuşmazlıkların Çözümü','Разрешение споров'),T.disp(v)],

/* ---------- регистрация ---------- */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rd=n=>String(Math.floor(Math.random()*10**n)).padStart(n,'0');
function idCheck(first9){const d=[...first9].map(Number);const d10=((((d[0]+d[2]+d[4]+d[6]+d[8])*7-(d[1]+d[3]+d[5]+d[7]))%10)+10)%10;const d11=(d.reduce((a,b)=>a+b,0)+d10)%10;return first9+d10+d11}
function idValid(s){return /^[1-9]\d{10}$/.test(s)&&idCheck(s.slice(0,9))===s}
function idGen(foreign){const b=foreign?'99'+rd(7):String(1+Math.floor(Math.random()*9))+rd(8);return idCheck(b)}
const DOCS=[['T.C. Kimlik Kartı','T.C. Kimlik Kartı'],['İkamet İzni (вид на жительство)','İkamet İzni'],['Паспорт (Pasaport)','Pasaport']];
const docName=u=>{const i=u.docIdx??DOCS.findIndex(d=>d[0]===u.docType);return i>=0?pick2(DOCS[i]):(u.docType||'')};
function idLine(u){return `${u.citizenship==='foreign'?'Yabancı Kimlik No':'T.C. Kimlik No'} ${u.idNo||''}${u.taxNo?tx(', налоговый № ',', vergi no ')+u.taxNo:''}`}
function docLine(u){return `${docName(u)} № ${u.docNo||''}${u.docValid?tx(', действителен до ',', geçerlilik ')+fmtDate(u.docValid):''}`}

    set('r_id',idGen(foreign));set('r_tax','');set('r_docNo',foreign?'A'+rd(8):'A'+rd(2)+'Z'+rd(5));set('r_docValid','2030-06-30');

    if(!k){box.innerHTML='';return null}
    if(!l){box.innerHTML=`<span class="hint no">${tx('Код не найден в реестре. Проверьте написание.','Kod sicilde bulunamadı. Yazımı kontrol edin.')}</span>`;return null}
    const c=S.contracts[l.contractId];box.innerHTML=`<span class="hint ok">${tx(`Код действителен: ${roleUI(l.role).toLowerCase()} по договору № ${esc(c.no)} (${tTitle(c.type).toLowerCase()}) от ${fmtDate(iso(c.createdAt))}.`,`Kod geçerli: ${fmtDate(iso(c.createdAt))} tarihli ${esc(c.no)} numaralı sözleşmede (${tTitle(c.type).toLocaleLowerCase('tr')}) ${roleUI(l.role)}.`)}</span>`;return k};
  $('#c_id2').oninput=info;info();
  $('#cf').onsubmit=e=>{e.preventDefault();const k=info();if(!k){toast(tx('Введите действующий код ID2','Geçerli bir ID2 kodu girin'));return}
    createRequest(k,u?u.id:null,$('#c_who').value.trim(),+$('#c_purpose').value);toast(tx('Запрос отправлен владельцу','Talep bilgi sahibine gönderildi'));renderMyReqs();
    $('#myreqs').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'})};
  renderMyReqs();
}
function renderMyReqs(){
  const box=$('#myreqs');if(!box)return;
  const list=myReqs.map(id=>S.requests[id]).filter(Boolean);
  if(!list.length){box.innerHTML='';return}
  box.innerHTML=`<h2>${tx('Ваши запросы','Talepleriniz')}</h2>`+list.map(r=>{
    const st=STATUS[r.status];const owner=S.users[r.ownerId];const c=S.contracts[r.contractId];
    let body='';
    if(r.status==='pending')body=`<div class="row"><span class="wait"></span><span>${tx('Ждём ответа владельца данных.','Bilgi sahibinin yanıtı bekleniyor.')}</span></div>
      <p class="small muted">${tx('Уведомления отправлены:','Bildirim gönderildi:')} ${tx('почта','e-posta')} ${esc(maskEmail(owner.email))}, SMS ${esc(maskPhone(owner.phone))}, ${tx('личный кабинет. Запрос действует 15 минут.','hesap. Talep 15 dakika geçerlidir.')}</p>
      <div class="notice small"><b>${tx('Демо.','Demo.')}</b> ${tx('Чтобы ответить за владельца, войдите под его ID в другой вкладке или здесь:','Bilgi sahibi adına yanıt vermek için başka bir sekmede veya burada onun ID\'siyle giriş yapın:')} <button class="btn sm" type="button" data-as="${esc(owner.id)}">${tx('Войти как владелец и ответить','Sahibi olarak giriş yap ve yanıtla')}</button></div>`;
    else if(r.status==='approved'){const wm=Array(40).fill(`${esc(r.requesterLabel)} · ${fmtDT(r.decidedAt)}`).map(t=>`<span>${t}</span>`).join('');
      body=`<div class="reveal"><div class="wm">${wm}</div>
        <div class="row between" style="position:relative"><span class="pill good">${tx('Владелец разрешил просмотр','Sahibi görüntülemeye izin verdi')}</span><div style="text-align:right"><div class="small muted">${tx('Данные скроются через','Bilgiler gizlenecek:')}</div><div class="timer" data-exp="${r.expiresAt}">${mmss(r.expiresAt-Date.now())}</div></div></div>
        <div class="bar" style="margin:10px 0 14px;position:relative"><i data-bar="${r.expiresAt}" style="width:${Math.max(0,(r.expiresAt-Date.now())/VIEW_MS*100)}%"></i></div>
        <dl class="kv" style="position:relative"><dt>${tx('Имя и фамилия','Ad soyad')}</dt><dd>${esc(fio(owner))}</dd><dt>${tx('Дата и место рождения','Doğum tarihi ve yeri')}</dt><dd>${fmtDate(owner.birth)}, ${esc(owner.birthPlace||'')}</dd><dt>${tx('Идентификационный №','Kimlik numarası')}</dt><dd>${esc(idLine(owner))}</dd><dt>${tx('Документ','Belge')}</dt><dd>${esc(docLine(owner))}</dd><dt>${tx('Адрес регистрации','Yerleşim yeri adresi')}</dt><dd>${esc(owner.addr)}</dd><dt>${tx('Роль в договоре','Sözleşmedeki rolü')}</dt><dd>${roleUI(r.role)}, ${tx('договор №','sözleşme no')} ${esc(c?.no)}</dd></dl>
        <p class="small muted" style="position:relative;margin-top:10px">${tx('Контакты владельца не раскрываются. Просмотр записан в журнал доступа.','Sahibinin iletişim bilgileri gösterilmez. Görüntüleme erişim kaydına işlendi.')}</p></div>`;}
    else if(r.status==='expired')body=`<p>${tx('Время просмотра истекло, данные скрыты. Чтобы увидеть их снова, отправьте новый запрос.','Görüntüleme süresi doldu, bilgiler gizlendi. Tekrar görmek için yeni talep gönderin.')}</p>`;
    else if(r.status==='denied')body=`<p>${tx('Владелец отклонил запрос. Если данные нужны для суда или исполнения договора, обратитесь к владельцу напрямую или через уполномоченный орган.','Bilgi sahibi talebi reddetti. Bilgiler dava veya sözleşmenin ifası için gerekiyorsa sahibine doğrudan ya da yetkili kurum aracılığıyla başvurun.')}</p>`;
    else if(r.status==='revoked')body=`<p>${tx('Владелец отозвал доступ досрочно. Данные скрыты.','Bilgi sahibi erişimi süre dolmadan geri aldı. Bilgiler gizlendi.')}</p>`;
    else body=`<p>${tx('Владелец не ответил за 15 минут. Запрос закрыт.','Bilgi sahibi 15 dakika içinde yanıt vermedi. Talep kapatıldı.')}</p>`;
    return `<div class="req ${r.status==='approved'?'live':r.status==='pending'?'attn':''}"><div class="row between"><div class="row"><span class="code">${esc(r.id2)}</span><span class="pill ${st[1]}">${pick2(st[0])}</span></div><span class="small muted">${fmtDT(r.createdAt)}</span></div>${body}</div>`;
  }).join('');
  box.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{setMe(b.dataset.as);location.hash='cabinet'});
}

function updateTimers(){
  const n=Date.now();
  document.querySelectorAll('[data-exp]').forEach(el=>el.textContent=mmss(+el.dataset.exp-n));
  document.querySelectorAll('[data-bar]').forEach(el=>el.style.width=Math.max(0,(+el.dataset.bar-n)/VIEW_MS*100)+'%');
}
function softRender(){if(view==='cabinet')viewCabinet();else if(view==='check')renderMyReqs();}

/* ---------- router ---------- */
function route(keepScroll){
  const h=decodeURIComponent(location.hash.slice(1))||'home';
  sweep();
  if(h.startsWith('check-')){view='check';viewArg=normId(h.slice(6))}
  else if(h.startsWith('doc-')){view='doc';viewArg=h.slice(4)}
  else if(h.startsWith('tpl-')){view='templates';viewArg=h.slice(4)}
  else{view=['home','templates','register','cabinet','new','check'].includes(h)?h:'home';viewArg=null}
  renderChrome();
  ({home:viewHome,templates:()=>viewTemplates(viewArg),register:viewRegister,cabinet:viewCabinet,new:viewNew,check:()=>viewCheck(viewArg),doc:()=>viewDoc(viewArg)})[view]();
  if(keepScroll!==true)window.scrollTo(0,0);
}

  S=emptyState();
  const a=addUser({first:'Ayşe',last:'Yılmaz',middle:'',birth:'1979-03-21',birthPlace:'İzmir',citizenship:'TR',idNo:idCheck('104567891'),taxNo:'',docIdx:0,docType:'T.C. Kimlik Kartı',docNo:'A12Z34567',docValid:'2031-03-21',addr:'Antalya, Muratpaşa, Şirinyalı Mah. 1520 Sok. No: 8 D: 3',email:'ayse.test@example.com',phone:'+90 532 000 11 22',consentAt:Date.now(),demo:true});
  const b=addUser({first:'Marat',last:'Demirov',middle:'',birth:'1992-09-03',birthPlace:'Kazan, Rusya',citizenship:'foreign',idNo:idCheck('991234567'),taxNo:'',docIdx:1,docType:'İkamet İzni',docNo:'A01234567',docValid:'2028-09-01',addr:'Antalya, Muratpaşa, Fener Mah. 1950 Sok. No: 12 D: 5',email:'marat.test@example.com',phone:'+90 532 000 33 44',consentAt:Date.now(),demo:true});
  const st=addDays(-20);
  const terms={address:F.address.ex,tapu:F.tapu.ex,area:95,rooms:'2+1',residents:1,pets:'1',utilities:'0',startDate:st,endDate:addMonthsISO(st,12),rent:35000,payDay:5,deposit:70000,indexCap:25,city:'Antalya'};
  const c=createContract('residential',terms,{landlord:a.id,tenant:b.id},a.id,true);S.demoContract=c.id;S.outbox=[];save();

if(!S||!S.users||S.v!==3)seed();
if(me&&!S.users[me])setMe(null);

let resetArm=false;
$('#resetBtn').onclick=e=>{if(!resetArm){resetArm=true;e.target.textContent=tx('Нажмите ещё раз для сброса','Sıfırlamak için tekrar tıklayın');setTimeout(()=>{resetArm=false;e.target.textContent=tx('Сбросить демо-данные','Demo verilerini sıfırla')},4000);return}
  resetArm=false;seed();setMe(null);myReqs=[];saveMyReqs();location.hash='home';route();toast(tx('Демо-данные восстановлены','Demo verileri geri yüklendi'))};
window.addEventListener('hashchange',()=>route());
window.addEventListener('storage',e=>{if(e.key===KEY){const n=load();if(n){S=n;softRender()}}});
setInterval(()=>{if(sweep())softRender();updateTimers()},1000);
route();
</script>
